name: Update DART data and deploy dashboard
on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - 'docs/data.json'
  schedule:
    - cron: '0 0 1 * *' # 09:00 KST on the 1st of each month
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: naver-pages
  cancel-in-progress: false
jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Fetch reports and calculate metrics
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          test -n "$DART_API_KEY" || { echo 'Set repository secret DART_API_KEY'; exit 1; }
          python src/dart_pipeline.py
      - name: Commit updated source data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data.json
          if ! git diff --cached --quiet; then
            git commit -m "Update NAVER DART disclosures"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
